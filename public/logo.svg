<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" fill="none">
  <!-- Gold arc (top-left to top-right) -->
  <path
    d="M 50 140 A 90 90 0 1 1 230 140"
    stroke="#F5B800"
    stroke-width="10"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Dark red arc (bottom) -->
  <path
    d="M 50 145 A 90 90 0 0 0 230 145"
    stroke="#9B1B1B"
    stroke-width="10"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Sparkle star (top-right of circle) -->
  <g transform="translate(218, 58)">
    <polygon points="0,-9 2.1,-2.1 9,0 2.1,2.1 0,9 -2.1,2.1 -9,0 -2.1,-2.1" fill="#F5B800"/>
    <polygon points="0,-5 1.2,-1.2 5,0 1.2,1.2 0,5 -1.2,1.2 -5,0 -1.2,-1.2" fill="#FFDD55" transform="rotate(45)"/>
  </g>

  <!-- CNE text -->
  <text
    x="140"
    y="158"
    text-anchor="middle"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="72"
    font-weight="900"
    font-style="italic"
    fill="#1B2B8A"
    letter-spacing="-2"
  >CNE</text>

  <!-- Company name -->
  <text
    x="140"
    y="240"
    text-anchor="middle"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="16.5"
    font-weight="900"
    fill="#1a1a1a"
    letter-spacing="1.5"
  >CAHAYA NUSANTARA ELEKTRIK</text>
</svg>
